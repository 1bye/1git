# Lefthook configuration
# https://github.com/evilmartians/lefthook

pre-commit:
  jobs:
    - name: oxfmt
      glob: "*.{js,ts,cjs,mjs,cts,mts,jsx,tsx,json,jsonc}"
      run: bun oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: oxlint
      glob: "*.{js,ts,cjs,mjs,cts,mts,jsx,tsx}"
      run: bun oxlint --no-error-on-unmatched-pattern {staged_files}
