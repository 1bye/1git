[package]
name = "onegit-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Native 1git repository browsing on Rake"

[[bin]]
name = "1git"
path = "src/main.rs"

[dependencies]
onegit-git.workspace = true
onegit-ui.workspace = true
gpui-ce-motion.workspace = true
rake.workspace = true
serde_json.workspace = true
serde.workspace = true
tempfile.workspace = true
sha2.workspace = true
notify = "=8.2.0"
async-channel = "=2.5.0"
chrono = {workspace = true, features = ["clock"]}

[features]
test-support = ["onegit-ui/test-support", "rake/view-test-support"]

[lints]
workspace = true

[package.metadata.rake.bundle]
name = "1git"
identifier = "dev.1git.rust"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSAppearance", "NSGraphics", "NSResponder", "NSView", "NSVisualEffectView", "NSWindow"] }
raw-window-handle = "=0.6.2"
