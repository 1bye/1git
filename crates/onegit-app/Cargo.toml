[package]
name = "onegit-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Native 1git repository browsing on Rake"

[[bin]]
name = "1git"
path = "src/main.rs"

[dependencies]
onegit-git.workspace = true
onegit-ui.workspace = true
rake.workspace = true

[features]
test-support = ["onegit-ui/test-support", "rake/view-test-support"]

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

[package.metadata.rake.bundle]
name = "1git"
identifier = "dev.1git.rust"
