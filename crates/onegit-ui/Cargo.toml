[package]
name = "onegit-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Reusable 1git components and themes on Rake and GPUI"

[dependencies]
gpui-ce-motion.workspace = true
unicode-segmentation.workspace = true
rake = { workspace = true, features = ["experimental-view"] }

[features]
test-support = ["rake/view-test-support"]

[[test]]
name = "interaction"
required-features = ["test-support"]

[[test]]
name = "inputs"
required-features = ["test-support"]

[[test]]
name = "overlays"
required-features = ["test-support"]

[[test]]
name = "dialogs"
required-features = ["test-support"]

[[test]]
name = "toasts"
required-features = ["test-support"]

[lints]
workspace = true
