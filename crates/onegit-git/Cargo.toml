[package]
name = "onegit-git"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Validated Git CLI operations and binary-safe repository state for 1git"

[dependencies]
sha2.workspace = true
regex.workspace = true
tempfile.workspace = true
url.workspace = true
base64.workspace = true
chrono.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography"] }
